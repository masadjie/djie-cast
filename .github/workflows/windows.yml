name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["win-v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Unduh scrcpy (Windows)
        shell: bash
        run: ./scripts/fetch-scrcpy-win.sh
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: djie-cast-windows
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
